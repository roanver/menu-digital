<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="plate-grad" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </radialGradient>
    <radialGradient id="bg-grad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#C4864A"/>
      <stop offset="100%" stop-color="#8B5E2C"/>
    </radialGradient>
    <radialGradient id="bread-top" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#D4903C"/>
      <stop offset="100%" stop-color="#A8662A"/>
    </radialGradient>
    <radialGradient id="bread-bot" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C07C30"/>
      <stop offset="100%" stop-color="#9A5E22"/>
    </radialGradient>
  </defs>

  <!-- Background: warm wooden table -->
  <rect width="800" height="400" fill="url(#bg-grad)"/>
  <!-- Wood grain lines -->
  <line x1="0" y1="60" x2="800" y2="55" stroke="rgba(255,255,255,0.06)" stroke-width="18"/>
  <line x1="0" y1="140" x2="800" y2="150" stroke="rgba(0,0,0,0.07)" stroke-width="12"/>
  <line x1="0" y1="240" x2="800" y2="235" stroke="rgba(255,255,255,0.05)" stroke-width="22"/>
  <line x1="0" y1="330" x2="800" y2="340" stroke="rgba(0,0,0,0.06)" stroke-width="14"/>

  <!-- Plate shadow -->
  <ellipse cx="400" cy="218" rx="186" ry="24" fill="rgba(0,0,0,0.22)"/>
  <!-- Plate -->
  <circle cx="400" cy="200" r="186" fill="url(#plate-grad)"/>
  <circle cx="400" cy="200" r="180" fill="none" stroke="rgba(18,32,26,0.07)" stroke-width="2"/>
  <circle cx="400" cy="200" r="154" fill="none" stroke="rgba(18,32,26,0.05)" stroke-width="1"/>

  <!-- Lettuce / lechuga leaves -->
  <ellipse cx="362" cy="204" rx="62" ry="22" fill="#3FA46A" transform="rotate(-12,362,204)"/>
  <ellipse cx="440" cy="196" rx="58" ry="20" fill="#3D9E65" transform="rotate(8,440,196)"/>
  <ellipse cx="400" cy="192" rx="70" ry="18" fill="#4DB877" transform="rotate(-3,400,192)"/>
  <!-- Lettuce texture lines -->
  <path d="M350,195 Q370,188 390,194" fill="none" stroke="rgba(18,32,26,0.12)" stroke-width="1"/>
  <path d="M415,190 Q435,183 455,192" fill="none" stroke="rgba(18,32,26,0.12)" stroke-width="1"/>

  <!-- Tomato slices -->
  <ellipse cx="374" cy="200" rx="36" ry="14" fill="#C2402B" transform="rotate(-8,374,200)"/>
  <ellipse cx="374" cy="200" rx="30" ry="10" fill="#D64E38" transform="rotate(-8,374,200)"/>
  <ellipse cx="426" cy="197" rx="34" ry="13" fill="#C2402B" transform="rotate(6,426,197)"/>
  <ellipse cx="426" cy="197" rx="28" ry="9" fill="#D64E38" transform="rotate(6,426,197)"/>
  <!-- Tomato seeds -->
  <ellipse cx="370" cy="199" rx="5" ry="3" fill="#E86050" transform="rotate(-8,370,199)"/>
  <ellipse cx="380" cy="201" rx="5" ry="3" fill="#E86050" transform="rotate(-8,380,201)"/>

  <!-- Meat / carne (churrasco shape) -->
  <ellipse cx="400" cy="207" rx="92" ry="28" fill="#7A3B1E"/>
  <ellipse cx="400" cy="204" rx="88" ry="24" fill="#8C4422"/>
  <!-- Grill marks -->
  <path d="M348,202 Q360,196 372,202" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M360,208 Q372,202 384,208" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M388,200 Q400,194 412,200" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M416,205 Q428,199 440,205" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" stroke-linecap="round"/>

  <!-- Avocado / palta slices -->
  <ellipse cx="356" cy="196" rx="18" ry="26" fill="#5B7A44" transform="rotate(-20,356,196)"/>
  <ellipse cx="356" cy="196" rx="12" ry="19" fill="#8BB85C" transform="rotate(-20,356,196)"/>
  <ellipse cx="446" cy="194" rx="18" ry="26" fill="#5B7A44" transform="rotate(15,446,194)"/>
  <ellipse cx="446" cy="194" rx="12" ry="19" fill="#8BB85C" transform="rotate(15,446,194)"/>

  <!-- Bread bun top -->
  <ellipse cx="400" cy="177" rx="104" ry="44" fill="url(#bread-top)"/>
  <ellipse cx="385" cy="162" rx="28" ry="12" fill="rgba(255,255,255,0.14)"/>
  <!-- Sesame seeds -->
  <ellipse cx="378" cy="166" rx="5" ry="3" fill="#E8C86A" transform="rotate(-15,378,166)"/>
  <ellipse cx="400" cy="158" rx="5" ry="3" fill="#E8C86A" transform="rotate(5,400,158)"/>
  <ellipse cx="422" cy="164" rx="5" ry="3" fill="#E8C86A" transform="rotate(20,422,164)"/>
  <ellipse cx="390" cy="154" rx="4" ry="2.5" fill="#E8C86A" transform="rotate(-8,390,154)"/>
  <ellipse cx="411" cy="155" rx="4" ry="2.5" fill="#E8C86A" transform="rotate(12,411,155)"/>

  <!-- Bread bun bottom -->
  <ellipse cx="400" cy="224" rx="108" ry="22" fill="url(#bread-bot)"/>
  <ellipse cx="388" cy="218" rx="22" ry="8" fill="rgba(255,255,255,0.1)"/>

  <!-- Fries / papas fritas (side) -->
  <rect x="570" y="148" width="14" height="72" rx="4" fill="#E8C040"/>
  <rect x="588" y="155" width="14" height="66" rx="4" fill="#DDB830"/>
  <rect x="606" y="144" width="14" height="74" rx="4" fill="#E8C040"/>
  <rect x="624" y="150" width="14" height="68" rx="4" fill="#DDB830"/>
  <rect x="642" y="158" width="14" height="62" rx="4" fill="#E8C040"/>
  <!-- Fries shadow -->
  <ellipse cx="610" cy="224" rx="48" ry="8" fill="rgba(0,0,0,0.18)"/>
  <!-- Salt dots -->
  <circle cx="578" cy="162" r="2" fill="white" opacity="0.7"/>
  <circle cx="600" cy="154" r="2" fill="white" opacity="0.7"/>
  <circle cx="620" cy="160" r="2" fill="white" opacity="0.7"/>

  <!-- Small salad on left -->
  <ellipse cx="168" cy="208" rx="58" ry="52" fill="#E8E4DC" opacity="0.9"/>
  <ellipse cx="168" cy="206" rx="52" ry="46" fill="#FAFAF8"/>
  <ellipse cx="155" cy="200" rx="22" ry="18" fill="#4DB877" transform="rotate(-15,155,200)"/>
  <ellipse cx="178" cy="194" rx="20" ry="15" fill="#3FA46A" transform="rotate(10,178,194)"/>
  <ellipse cx="162" cy="208" rx="18" ry="14" fill="#5B7A44" transform="rotate(-5,162,208)"/>
  <ellipse cx="180" cy="210" rx="16" ry="12" fill="#4DB877"/>
  <ellipse cx="162" cy="198" rx="10" ry="7" fill="#C2402B" transform="rotate(-10,162,198)"/>
  <ellipse cx="178" cy="202" rx="10" ry="7" fill="#C2402B" transform="rotate(8,178,202)"/>

  <!-- Plate rim highlight -->
  <ellipse cx="338" cy="100" rx="62" ry="18" fill="rgba(255,255,255,0.18)" transform="rotate(-30,338,100)"/>
</svg>
