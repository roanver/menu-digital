<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640">
  <defs>
    <pattern id="wood" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#9E6B3A"/>
      <rect x="0" y="0" width="80" height="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="0" y="12" width="80" height="3" fill="rgba(0,0,0,0.06)"/>
      <rect x="0" y="28" width="80" height="5" fill="rgba(255,255,255,0.03)"/>
      <rect x="0" y="42" width="80" height="3" fill="rgba(0,0,0,0.05)"/>
      <rect x="0" y="58" width="80" height="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="0" y="72" width="80" height="3" fill="rgba(0,0,0,0.06)"/>
    </pattern>
    <filter id="paper-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="rgba(18,32,26,0.3)"/>
    </filter>
    <filter id="pen-shadow" x="-20%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Wooden table background -->
  <rect width="800" height="640" fill="url(#wood)"/>
  <!-- Ambient light gradient -->
  <rect width="800" height="640" fill="transparent">
    <animate attributeName="opacity" values="0" dur="0s" fill="freeze"/>
  </rect>
  <ellipse cx="400" cy="200" rx="450" ry="320" fill="rgba(255,255,255,0.06)"/>

  <!-- Paper shadow -->
  <rect x="148" y="68" width="488" height="508" rx="6" fill="rgba(0,0,0,0.18)" filter="url(#paper-shadow)"/>

  <!-- Paper sheet (la carta de papel) -->
  <rect x="140" y="52" width="488" height="508" rx="4" fill="#FEFCF6"/>
  <!-- Paper texture lines (ruled) -->
  <line x1="140" y1="136" x2="628" y2="136" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="176" x2="628" y2="176" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="216" x2="628" y2="216" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="256" x2="628" y2="256" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="296" x2="628" y2="296" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="336" x2="628" y2="336" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="376" x2="628" y2="376" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="416" x2="628" y2="416" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="456" x2="628" y2="456" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <line x1="140" y1="496" x2="628" y2="496" stroke="rgba(18,32,26,0.06)" stroke-width="1"/>
  <!-- Left margin line -->
  <line x1="196" y1="52" x2="196" y2="560" stroke="rgba(195,100,100,0.18)" stroke-width="1.5"/>

  <!-- Restaurant name header -->
  <text x="384" y="104" font-family="Georgia,serif" font-size="22" fill="#12201A" text-anchor="middle" font-weight="bold" letter-spacing="1">La Picá del Tito</text>
  <line x1="210" y1="115" x2="558" y2="115" stroke="#12201A" stroke-width="1.5"/>
  <line x1="210" y1="119" x2="558" y2="119" stroke="#12201A" stroke-width="0.5"/>

  <!-- Category: Para picar -->
  <text x="214" y="158" font-family="Arial,sans-serif" font-size="11" fill="#157347" font-weight="bold" letter-spacing="2" text-transform="uppercase">PARA PICAR</text>
  <!-- underline category -->
  <line x1="214" y1="162" x2="340" y2="162" stroke="#157347" stroke-width="1"/>

  <!-- Items with dotted leader lines + prices -->
  <text x="214" y="196" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Empanada de pino</text>
  <line x1="378" y1="193" x2="540" y2="193" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="196" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$2.500</text>

  <text x="214" y="236" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Papas bravas</text>
  <line x1="322" y1="233" x2="540" y2="233" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="236" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$4.900</text>

  <text x="214" y="276" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Chorrillana chica</text>
  <line x1="378" y1="273" x2="540" y2="273" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="276" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$8.900</text>

  <!-- Category: Del sartén -->
  <text x="214" y="318" font-family="Arial,sans-serif" font-size="11" fill="#157347" font-weight="bold" letter-spacing="2">DEL SARTÉN</text>
  <line x1="214" y1="322" x2="346" y2="322" stroke="#157347" stroke-width="1"/>

  <text x="214" y="356" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Churrasco italiano</text>
  <line x1="388" y1="353" x2="540" y2="353" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="356" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$7.000</text>

  <text x="214" y="396" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Lomo a lo pobre</text>
  <line x1="366" y1="393" x2="540" y2="393" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="396" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$9.800</text>

  <text x="214" y="436" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Pollo asado</text>
  <line x1="298" y1="433" x2="540" y2="433" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="436" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$6.500</text>

  <!-- Category: Bebidas -->
  <text x="214" y="478" font-family="Arial,sans-serif" font-size="11" fill="#157347" font-weight="bold" letter-spacing="2">BEBIDAS</text>
  <line x1="214" y1="482" x2="302" y2="482" stroke="#157347" stroke-width="1"/>

  <text x="214" y="516" font-family="Georgia,serif" font-size="14.5" fill="#12201A">Bebida en lata</text>
  <line x1="330" y1="513" x2="540" y2="513" stroke="#12201A" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="548" y="516" font-family="Georgia,serif" font-size="14.5" fill="#12201A" text-anchor="end">$1.500</text>

  <text x="214" y="548" font-family="Georgia,serif" font-size="14.5" fill="#5A5A50" font-style="italic">* Cambio o tarjeta, preguntar</text>

  <!-- Paper curl bottom-right corner -->
  <path d="M628 528 Q628 560 596 560 L628 560 Z" fill="#EEE8DC"/>
  <path d="M628 528 Q628 560 596 560" fill="none" stroke="rgba(18,32,26,0.12)" stroke-width="1"/>

  <!-- Pen/bolígrafo resting on paper -->
  <g filter="url(#pen-shadow)" transform="rotate(-28, 660, 340)">
    <!-- Pen body -->
    <rect x="638" y="220" width="16" height="220" rx="8" fill="#2B3D34"/>
    <!-- Pen clip -->
    <rect x="648" y="224" width="4" height="160" rx="2" fill="#1A2820"/>
    <!-- Pen top cap -->
    <rect x="636" y="216" width="20" height="16" rx="8" fill="#1A2820"/>
    <!-- Pen grip (textured) -->
    <rect x="638" y="380" width="16" height="42" rx="3" fill="#157347"/>
    <!-- Pen tip -->
    <polygon points="646,440 651,440 649,460" fill="#C0C0C0"/>
    <circle cx="649" cy="460" r="2" fill="#888"/>
    <!-- Pen brand ring -->
    <rect x="638" y="374" width="16" height="4" rx="2" fill="#7FA791"/>
  </g>

  <!-- Paperclip top-left corner -->
  <g transform="translate(160, 60)">
    <path d="M0 0 L0 60 Q0 72 12 72 Q24 72 24 60 L24 24 Q24 12 12 12 Q6 12 6 18 L6 66 Q6 68 8 68 Q10 68 10 66 L10 20 Q10 16 12 16 Q16 16 16 24 L16 60 Q16 68 8 68" fill="none" stroke="#A0A0A0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
